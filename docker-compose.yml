services:

  jam-ui-only0:
    container_name: jam_docker_jam_ui_only0
    image: ghcr.io/joinmarket-webui/jam-dev-ui-only:master
    #image: joinmarket-webui/jam-local-ui-only:latest # local build
    environment:
      JAM_JMWALLETD_HOST: jam-standalone0
      JAM_JMWALLETD_API_PORT: 28183
      JAM_JMOBWATCH_HOST: jam-standalone0
      JAM_JMOBWATCH_PORT: 8000
    ports:
      - '41080:80'
    depends_on:
      jam-standalone0:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget --output-document /dev/null http://127.0.0.1:80/jam/api/v0/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 3s

  jam-ui-only1:
    container_name: jam_docker_jam_ui_only1
    image: ghcr.io/joinmarket-webui/jam-dev-ui-only:master
    environment:
      JAM_JMWALLETD_HOST: jam-standalone1
      JAM_JMWALLETD_API_PORT: 28183
      JAM_JMWALLETD_WEBSOCKET_PORT: 28183
      JAM_JMWALLETD_WEBSOCKET_PATH: /api/v1/ws
      JAM_JMOBWATCH_HOST: jam-standalone1
      JAM_JMOBWATCH_PORT: 17000
    ports:
      - '41081:80'
    depends_on:
      jam-standalone1:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget --output-document /dev/null http://127.0.0.1:80/jam/api/v0/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 3s

  jam-standalone0:
    container_name: jam_docker_jam_standalone0
    image: ghcr.io/joinmarket-webui/jam-dev-standalone-ng:master
    #image: joinmarket-webui/jam-local-standalone-ng:latest # local build
    environment:
      READY_FILE: /root/.regtest-initializer/btc_fully_synched
      BITCOIN__RPC_URL: http://bitcoind:43782
      BITCOIN__RPC_COOKIE_FILE: /root/.bitcoin_data/regtest/.cookie
      LOGGING__LEVEL: DEBUG
      NETWORK_CONFIG__NETWORK: testnet
      NETWORK_CONFIG__BITCOIN_NETWORK: regtest
      NETWORK_CONFIG__DIRECTORY_SERVERS: node1.onion:5222, node2.onion:5222
    ports:
      - '42080:80'
    volumes:
      - 'jam_standalone0_datadir:/root/.joinmarket-ng'
      - 'bitcoin_regtest_initializer_datadir:/root/.regtest-initializer'
      - 'bitcoin_datadir:/root/.bitcoin_data' # mount bitcoind dir to access .cookie file
    depends_on:
      bitcoind:
        condition: service_healthy
      bitcoin-regtest-initializer:
        condition: service_started

  jam-standalone1:
    container_name: jam_docker_jam_standalone1
    image: ghcr.io/joinmarket-webui/jam-dev-standalone-ng:master
    environment:
      READY_FILE: /root/.regtest-initializer/btc_fully_synched
      WAIT_FOR_BITCOIND: 'true' # default: true
      OBWATCH_URL: http://localhost:17000
      ###################################
      # joinmarket-ng config
      # see: https://github.com/joinmarket-ng/joinmarket-ng/blob/main/jmcore/src/jmcore/data/config.toml.template
      ###################################
      BITCOIN__RPC_URL: http://bitcoind:43782
      BITCOIN__RPC_USER: regtest
      BITCOIN__RPC_PASSWORD: regtest
      #BITCOIN__RPC_COOKIE_FILE: /root/.bitcoin_data/regtest/.cookie
      LOGGING__LEVEL: DEBUG
      NETWORK_CONFIG__NETWORK: testnet
      NETWORK_CONFIG__BITCOIN_NETWORK: regtest
      NETWORK_CONFIG__DIRECTORY_SERVERS: node3.onion:5222, node4.onion:5222
      MAKER__MIN_SIZE: 30000 # default: 100000
      MAKER__MIN_CONFIRMATIONS: 1 # default: 0
      MAKER__MERGE_ALGORITHM: 'greedy' # default: 'default'
      TAKER__MINIMUM_MAKERS: 2 # default: 4
      TAKER__MAKER_TIMEOUT_SEC: 30  # default: 60
      TAKER__BONDLESS_REQUIRE_ZERO_FEE: 'false' # default: true
      TUMBLER__MIN_CONFIRMATIONS_BETWEEN_PHASES: 0 # default: 6
      TUMBLER__CONFIRMATION_POLL_INTERVAL: 1 # default: 30.0
      TUMBLER__RETRY_DELAY_SECONDS: 1 # default: 1800.0
      ORDERBOOK_WATCHER__HTTP_PORT: 17000
      ORDERBOOK_WATCHER__UPDATE_INTERVAL: 10 # default: 60
      TUI__LOG_LEVEL: DEBUG # default: WARNING
    ports:
      - '42081:80'
    volumes:
      - 'jam_standalone1_datadir:/root/.joinmarket-ng'
      - 'bitcoin_regtest_initializer_datadir:/root/.regtest-initializer'
    depends_on:
      bitcoind:
        condition: service_healthy
      bitcoin-regtest-initializer:
        condition: service_started

  bitcoind:
    container_name: jam_docker_bitcoind
    restart: unless-stopped
    image: polarlightning/bitcoind:29.0@sha256:4521294ac25fdbf1492a8cc5ea987463a5f244b82546d29bbe8451db39f36f3a
    command:
      # rpcauth (user=regtest; password=regtest)
      -rpcauth=regtest:20b58677979ad9d3cf4b78b1d6e85e44$$2ec3e1e1c00c7c58d7aff1d4bf96e4a984ea1af5d676d862fd0faa857a1d4d7c
      -datadir=/home/bitcoin/data
      -walletdir=/home/bitcoin/walletdata
      -regtest=1
      -server=1
      -port=39388
      -rpcport=43782
      -rpcbind=0.0.0.0
      -rpcallowip=0.0.0.0/0
      -whitelist=0.0.0.0/0
      -maxmempool=500
      -debug=rpc
      -logips=0
      -networkactive=1
      -dnsseed=0
      -uacomment=jmdevbitcoindregtest
      -printpriority=1
      -logtimemicros=1
      -zmqpubrawblock=tcp://0.0.0.0:28332
      -zmqpubrawtx=tcp://0.0.0.0:28333
      -zmqpubhashblock=tcp://0.0.0.0:28334
      -dns=0
      -listenonion=0
      -deprecatedrpc=create_bdb
    expose:
      - 39388 # P2P
      - 43782 # RPC
      - 28332 # ZMQ
      - 28333 # ZMQ
      - 28334 # ZMQ
    volumes:
      - 'bitcoin_datadir:/home/bitcoin/data'
      - 'bitcoin_wallet_datadir:/home/bitcoin/walletdata'
    healthcheck:
      test:
        [
          'CMD',
          '/entrypoint.sh',
          'bitcoin-cli',
          '-chain=regtest',
          '-rpcport=43782',
          '-datadir=/home/bitcoin/data',
          '-getinfo',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
      start_interval: 3s

  bitcoin-regtest-initializer:
    container_name: jam_docker_bitcoind_initializer
    build:
      context: ./contrib/bitcoin-regtest-initializer
      dockerfile: Dockerfile
    restart: on-failure
    environment:
      READY_FILE: /root/.regtest-initializer/btc_fully_synched
      RPC_HOST: bitcoind
      RPC_PORT: 43782
      RPC_USER: regtest
      RPC_PASSWORD: regtest
    volumes:
      - 'bitcoin_regtest_initializer_datadir:/root/.regtest-initializer'
    depends_on:
      bitcoind:
        condition: service_healthy

volumes:
  bitcoin_datadir:
  bitcoin_wallet_datadir:
  bitcoin_regtest_initializer_datadir:
  jam_standalone0_datadir:
  jam_standalone1_datadir:
